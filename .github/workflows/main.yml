name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: permission
        run: chmod +x gradlew
      - name: build
        run: ./gradlew build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SculkMod-Jar
          path: build/libs/*.jar
